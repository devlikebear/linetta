name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux carries the dependency audit; it is platform-independent and
          # there is no reason to pay for it twice.
          - name: Linux
            os: ubuntu-latest
            audit: true
          # Windows is a shipped target whose debug build, checkout, and
          # platform-specific engine paths are not exercised anywhere else:
          # the release workflow only builds Windows in release mode.
          - name: Windows
            os: windows-latest
            audit: false

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Tauri Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.3.0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 25
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: ${{ matrix.os }}

      - name: Install security scanners
        if: matrix.audit
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          cargo install cargo-audit --locked

      - name: Verify
        run: make ci

      - name: Audit dependencies
        if: matrix.audit
        run: make audit
