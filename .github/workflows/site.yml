name: Site

# The marketing site is deployed separately from the app, so it is checked
# separately: keeping it out of `make ci` avoids paying for a Node install on
# every engine and shell change.
on:
  pull_request:
    paths:
      - 'apps/site/**'
      - '.github/workflows/site.yml'
  push:
    branches: [main]
    paths:
      - 'apps/site/**'
      - '.github/workflows/site.yml'

jobs:
  check:
    name: Type-check and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.3.0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 25
          cache: pnpm
          cache-dependency-path: apps/site/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: apps/site
        run: pnpm install --frozen-lockfile

      - name: Verify
        working-directory: apps/site
        run: |
          pnpm check
          pnpm build
