name: Build Desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            artifact: macos
            bundles: app
          - name: Linux
            os: ubuntu-latest
            artifact: linux
            bundles: appimage,deb
          - name: Windows
            os: windows-latest
            artifact: windows
            bundles: nsis

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tauri Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Build engine sidecar
        shell: bash
        run: bash scripts/build-engine.sh

      - name: Build Tauri app
        shell: bash
        working-directory: apps/desktop
        run: pnpm tauri build --no-bundle

      - name: Bundle app
        shell: bash
        working-directory: apps/desktop
        run: pnpm tauri bundle --bundles "${{ matrix.bundles }}"

      - name: Pack macOS app bundle
        if: runner.os == 'macOS'
        shell: bash
        working-directory: apps/desktop/src-tauri/target/release/bundle
        run: tar -czf Linetta-macos.app.tar.gz -C macos Linetta.app

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: Linetta-${{ matrix.artifact }}
          path: apps/desktop/src-tauri/target/release/bundle/**/*
          if-no-files-found: error
