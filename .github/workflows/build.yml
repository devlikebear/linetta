name: Build Desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            artifact: macos
            bundles: app
          - name: Linux
            os: ubuntu-latest
            artifact: linux
            bundles: appimage,deb,rpm
          - name: Windows
            os: windows-latest
            artifact: windows
            bundles: nsis,msi

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tauri Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf \
            rpm

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Check Apple signing configuration
        id: apple_signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          missing=()
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name:-}" ]; then
              missing+=("${name}")
            fi
          done

          if [ "${#missing[@]}" -eq 0 ]; then
            echo "configured=true" >> "${GITHUB_OUTPUT}"
          else
            echo "configured=false" >> "${GITHUB_OUTPUT}"
            printf 'Missing Apple signing secrets: %s\n' "${missing[*]}"
          fi

      - name: Require notarized macOS release asset
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v') && steps.apple_signing.outputs.configured != 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "Apple Developer ID signing and notarization secrets are required for tag releases." >&2
          echo "Configure APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_ID, APPLE_PASSWORD, and APPLE_TEAM_ID." >&2
          exit 1

      - name: Warn about unsigned macOS workflow build
        if: runner.os == 'macOS' && !startsWith(github.ref, 'refs/tags/v') && steps.apple_signing.outputs.configured != 'true'
        shell: bash
        run: |
          echo "::warning::Apple signing secrets are not configured. This workflow_dispatch macOS artifact will not be notarized."

      - name: Build engine sidecar
        shell: bash
        run: bash scripts/build-engine.sh

      - name: Build Tauri app
        shell: bash
        working-directory: apps/desktop
        run: pnpm tauri build --no-bundle

      - name: Bundle app
        shell: bash
        working-directory: apps/desktop
        run: pnpm tauri bundle --bundles "${{ matrix.bundles }}"

      - name: Sign and notarize macOS app
        if: runner.os == 'macOS' && steps.apple_signing.outputs.configured == 'true'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: scripts/sign-notarize-macos-app.sh apps/desktop/src-tauri/target/release/bundle/macos/Linetta.app

      - name: Collect release assets
        shell: bash
        working-directory: apps/desktop/src-tauri/target/release/bundle
        run: |
          set -euo pipefail
          mkdir -p dist
          case "${{ matrix.artifact }}" in
            macos)
              tar -czf dist/Linetta-macos.app.tar.gz -C macos Linetta.app
              ;;
            linux)
              cp appimage/*.AppImage dist/
              cp deb/*.deb dist/
              cp rpm/*.rpm dist/
              ;;
            windows)
              cp nsis/*-setup.exe dist/
              cp msi/*.msi dist/
              ;;
          esac
          ls -la dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: Linetta-${{ matrix.artifact }}
          path: apps/desktop/src-tauri/target/release/bundle/dist/
          if-no-files-found: error

  publish-release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
      macos_sha: ${{ steps.meta.outputs.macos_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download built assets
        uses: actions/download-artifact@v7
        with:
          path: dist
          pattern: Linetta-*
          merge-multiple: true

      - name: Compute version and macOS checksum
        id: meta
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          macos_asset="dist/Linetta-macos.app.tar.gz"
          test -f "${macos_asset}"
          macos_sha="$(shasum -a 256 "${macos_asset}" | awk '{print $1}')"
          printf 'version=%s\n' "${version}" >> "${GITHUB_OUTPUT}"
          printf 'macos_sha=%s\n' "${macos_sha}" >> "${GITHUB_OUTPUT}"

      - name: Render distribution metadata
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          RELEASE_URL_BASE: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}
        run: |
          set -euo pipefail
          windows_installer="$(find dist -maxdepth 1 -type f -name '*-setup.exe' | sort | head -n 1)"
          if [ -z "${windows_installer}" ]; then
            echo "Windows NSIS installer is required for winget metadata" >&2
            exit 1
          fi
          windows_sha="$(shasum -a 256 "${windows_installer}" | awk '{print $1}')"

          rm -rf release-metadata
          mkdir -p release-metadata/winget
          scripts/render-winget-manifest.sh \
            "${VERSION}" \
            "${RELEASE_URL_BASE}" \
            "$(basename "${windows_installer}")" \
            "${windows_sha}" \
            release-metadata/winget

          tar -czf dist/Linetta-winget-manifests.tar.gz -C release-metadata winget
          cp packaging/flathub/com.devlikebear.linetta.yml dist/Linetta-flathub-manifest.yml

          find dist -maxdepth 1 -type f ! -name SHA256SUMS -print | LC_ALL=C sort | while IFS= read -r asset; do
            shasum -a 256 "${asset}"
          done > dist/SHA256SUMS
          ls -la dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release upload "${TAG_NAME}" dist/* --clobber
          else
            gh release create "${TAG_NAME}" dist/* \
              --target "${GITHUB_SHA}" \
              --title "${TAG_NAME}" \
              --generate-notes
          fi

  update-homebrew:
    name: Update Homebrew tap
    needs: publish-release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require tap token
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${HOMEBREW_TAP_TOKEN}" ]; then
            echo "HOMEBREW_TAP_TOKEN is required to update devlikebear/homebrew-tap" >&2
            exit 1
          fi

      - name: Checkout Homebrew tap repository
        uses: actions/checkout@v4
        with:
          repository: devlikebear/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Render cask
        env:
          VERSION: ${{ needs.publish-release.outputs.version }}
          MACOS_SHA: ${{ needs.publish-release.outputs.macos_sha }}
        run: |
          set -euo pipefail
          mkdir -p homebrew-tap/Casks
          cat > homebrew-tap/Casks/linetta.rb <<EOF
          cask "linetta" do
            version "${VERSION}"
            sha256 "${MACOS_SHA}"

            url "https://github.com/devlikebear/linetta/releases/download/v#{version}/Linetta-macos.app.tar.gz"
            name "Linetta"
            desc "Local-first desktop writing app for long-form fiction"
            homepage "https://github.com/devlikebear/linetta"

            livecheck do
              url :url
              strategy :github_latest
            end

            # The macOS build is published for Apple Silicon only.
            depends_on arch: :arm64

            app "Linetta.app"

            zap trash: "~/Library/Application Support/com.devlikebear.linetta"
          end
          EOF
          cat homebrew-tap/Casks/linetta.rb

      - name: Commit and push cask update
        working-directory: homebrew-tap
        env:
          VERSION: ${{ needs.publish-release.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/linetta.rb
          if git diff --cached --quiet; then
            echo "cask already up to date"
            exit 0
          fi
          git commit -m "linetta ${VERSION}"
          git push origin HEAD:main
