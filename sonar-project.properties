# The trilingual files are three parallel translations of one document, and
# their structural identity is not a smell -- it is enforced. i18n.catalog.test.ts
# asserts the ko/en/ja catalogues have identical key sets and identical
# interpolation placeholders, and apps/site/content.ts carries the same
# marketing copy in the same shape three times. Every honest edit to either
# file is three near-identical hunks, so CPD reads a correct change as 50%
# duplication and the gate blocks the very thing the tests require.
sonar.cpd.exclusions=.github/workflows/mobile-*.yml,engine/internal/engineapp/*sync_*.go,engine/cmd/linetta-engine/*sync_*.go,engine/internal/gitsync/gitsync_mobile.go,apps/desktop/src/lib/i18n.tsx,apps/site/src/lib/content.ts
