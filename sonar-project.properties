# This file is NOT read. SonarCloud analyses this project with automatic
# analysis, which ignores sonar-project.properties and reads
# .sonarcloud.properties from the default branch instead. The real settings
# live there; edit that file.
#
# Kept, rather than deleted, because sonar-project.properties is what a
# CI-based analysis would read. If a sonar step is ever added to
# .github/workflows, this file becomes live and has to be brought into
# agreement with .sonarcloud.properties.
sonar.cpd.exclusions=.github/workflows/mobile-*.yml,engine/internal/engineapp/*sync_*.go,engine/cmd/linetta-engine/*sync_*.go,engine/internal/gitsync/gitsync_mobile.go,apps/desktop/src/lib/i18n.tsx,apps/site/src/lib/content.ts
