run:
  id: linetta-run
  workers: 4
  max_attempts: 2
  role_limits:
    researcher: 1
    leader: 1
    writer: 1
    editor: 1

queue:
  type: inmemory
  lease_timeout: 30s

llm:
  default_provider: codex
  providers:
    codex:
      provider: openai-codex
      model: gpt-5-codex
      auth_mode: oauth
      work_dir: .

roles:
  researcher:
    llm_provider: codex
    max_iterations: 2
  leader:
    llm_provider: codex
    max_iterations: 2
  writer:
    llm_provider: codex
    max_iterations: 4
  editor:
    llm_provider: codex
    max_iterations: 2

observe:
  events_jsonl: .tessera/runs/linetta/events.jsonl
  report_json: .tessera/runs/linetta/report.json
  html_report: .tessera/runs/linetta/report.html
