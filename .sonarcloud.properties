# SonarCloud reads THIS file, not sonar-project.properties.
#
# The project is analysed by SonarCloud's automatic analysis -- there is no
# sonar step in .github/workflows -- and automatic analysis reads
# .sonarcloud.properties from the DEFAULT BRANCH. It ignores
# sonar-project.properties outright, which is why every exclusion this
# repository has written since #66 has silently done nothing.
#
# Two consequences worth knowing before editing:
#   - A pull request cannot change its own exclusions. The setting has to be
#     on main before the analysis of any branch will honour it.
#   - sonar-project.properties is kept only as a pointer here. If CI-based
#     analysis is ever added, that file becomes live and the two must agree.

# Files whose duplication is a requirement rather than a smell.
#
# The trilingual pair: apps/desktop/src/lib/i18n.tsx and
# apps/site/src/lib/content.ts each hold the same document three times, in
# Korean, English and Japanese. i18n.catalog.test.ts asserts the three
# catalogues have identical key sets and identical interpolation
# placeholders, so any honest edit is three near-identical hunks and CPD
# reads a correct change as duplication -- a docs-only branch scored 50.8%.
#
# The mobile workflows and the *sync_* files are deliberately parallel for
# the same kind of reason, and were the original entries here.
sonar.cpd.exclusions=.github/workflows/mobile-*.yml,engine/internal/engineapp/*sync_*.go,engine/cmd/linetta-engine/*sync_*.go,engine/internal/gitsync/gitsync_mobile.go,apps/desktop/src/lib/i18n.tsx,apps/site/src/lib/content.ts
